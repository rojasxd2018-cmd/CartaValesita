<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Especial</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Notificación inicial -->
    <div id="notification" class="notification">
        <div class="notification-content">
            <div class="notification-icon">✉️</div>
            <div class="notification-text">
                <p class="notification-title">Tienes un nuevo mensaje</p>
                <p class="notification-subtitle">Revisa tu carta especial</p>
            </div>
            <div class="notification-close">&times;</div>
        </div>
    </div>

    <!-- Carta animada -->

    <div class="letter-container">
        <div class="letter-image" id="letterContainer">
            <div class="animated-mail">
                <div class="back-fold"></div>
                <div class="letter">
                    <div class="letter-border"></div>
                    <div class="letter-title"></div>
                    <div class="letter-context"></div>
                    <div class="letter-stamp">
                        <div class="letter-stamp-inner"></div>
                    </div>
                </div>
                <div class="top-fold"></div>
                <div class="body"></div>
                <div class="left-fold"></div>
            </div>
            <div class="shadow"></div>
        </div>
        <div class="instruction-text">
        </div>
    </div>
<!-- AGREGA ESTA LÍNEA NUEVA AQUÍ -->

    <!-- Modal de la carta abierta -->
    <div id="letterModal" class="modal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="letter-paper" id="letterPaper">
                <div class="letter-header">
                    <h1 id="letterTitle">PARA MI MUJER HERMOSAAA🫶💝</h1>
                    <div class="letter-date" id="letterDate">19-10-2024 💘 </div>
                </div>
                <div class="letter-body" id="letterBody">
                    <p class="greeting" id="greeting"></p>
                    <p id="paragraph1"></p>
                    <p id="paragraph2"></p>
                    <p id="paragraph3"></p>
                    <p id="paragraph4"></p>
                    <p class="signature" id="signature1"></p>

<!-- Contenedor de la firma y la foto pequeña -->
<div style="display: flex; align-items: center; gap: 15px; margin-top: 15px;">
    
    <p class="signature-name" id="signature2" style="margin: 0;"></p>
    
    <!-- Aquí está tu foto obligada a ser un cuadrito de 50x50 píxeles -->
    <img src="gatitomuejeje.jpg" alt="Gatito" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);">

</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mensaje de amor final -->
    <div id="loveMessage" class="love-message">
        <p id="loveText"></p>
    </div>

    <script>
        // Textos para el efecto typing
        const letterTexts = {
            greeting: "Mi querida valencita bella🫶💝,",
            paragraph1: "Espero que ute haya tenido bonito y bendecido dia, q ojalá hayas disfrutado este dia caluroso q nos dió el señor",
            paragraph2: "Quiero decirle lo muchismo que te extraño, la falta que me haces es enorme, Hoy queria decirle que no soñé con usted, pero sabes, desperte abrazando algo, sentí y pense q eras tu la q estaba abrazando, pero era la almohada DFKSDKF:(,",
            paragraph3: "Quiero decirte que eres una persona maravillosa, nunca pero nunca olvides lo hermosa y valiosa que eres mi valencita preciosa 🫶, eres una grán mujer, una grán hija, una grán hermana, y nse si te guste qa te diga esto, pero eres una gran compañera, para mi lo eres,",
            paragraph4: "eres una mujer preciosa, alguien que amo demasiado, que no te niego, tengo un grán miedo a perderte, porque para ti esto q le diga quizás no valga muchisimo, no quiero a otra persona q no seas tu, se lo valiosa que eres, lo hermosa q eres, eres una en millones, en billones mejor dicho, porque en un mundo lleno de gente falsa, desleales, te prefiero una y mil veces a ti mi valencita bella 🫶💝",
            signature1: "Recuerde lo muchisimo que te amo y q a costa de todo y de todos, volveré, te demostraré q a pesar de la distancia te amo demasiado, no quiero ser el mismo que te dañó, quiero ser aquel con el que te cases y q podamos ser felices amor, obviamente siendo de bendición de uno al otro, te amo con mivida, cuidese amorcito, tapese bien y descanse porfavor, te conozco y se que no estas descansando bien, no se el porque, pero se q no lo estas haciendo miamor:c, que tengas un hermosa noche y un buen fin de semana, nse si te gusta q te haga estas cosas:c, pero las hago para recordarte lo muchisimo que te amo, que a pesar de la distancia te seguiré amando y te lo demostraré haciendote este tipo de detalles, te amo muxisimo miamor, gracias y que el Señor te bendiga siempre amorcito mio:(, q tengas una linda noche, TE AMO MXO MXO MXO MXO MXOOOOOOOO🫶💝",
            signature2: "DEL AMOR DE TU VIDA JEJEJE"
        };

        const loveMessageText = "Te amo mucho mi amada hermosa 🫶💝";

        // Función para efecto typing
        function typeText(element, text, speed = 30) {
            return new Promise((resolve) => {
                element.textContent = '';
                let i = 0;
                const timer = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(timer);
                        resolve();
                    }
                }, speed);
            });
        }

        // Función para mostrar la carta con typing
        async function showLetterWithTyping() {
            const modal = document.getElementById('letterModal');
            const letterPaper = document.getElementById('letterPaper');
            
            // Mostrar modal con animación
            modal.style.display = 'block';
            modal.classList.add('modal-show');
            
            // Animación de entrada del papel
            setTimeout(() => {
                letterPaper.classList.add('letter-entrance');
            }, 100);

            // Esperar a que termine la animación de entrada
            setTimeout(async () => {
                // Typing secuencial de cada párrafo
                await typeText(document.getElementById('greeting'), letterTexts.greeting, 40);
                await new Promise(resolve => setTimeout(resolve, 500));
                
                await typeText(document.getElementById('paragraph1'), letterTexts.paragraph1, 25);
                await new Promise(resolve => setTimeout(resolve, 300));
                
                await typeText(document.getElementById('paragraph2'), letterTexts.paragraph2, 25);
                await new Promise(resolve => setTimeout(resolve, 300));
                
                await typeText(document.getElementById('paragraph3'), letterTexts.paragraph3, 25);
                await new Promise(resolve => setTimeout(resolve, 300));
                
                await typeText(document.getElementById('paragraph4'), letterTexts.paragraph4, 25);
                await new Promise(resolve => setTimeout(resolve, 500));
                
                await typeText(document.getElementById('signature1'), letterTexts.signature1, 35);
                await new Promise(resolve => setTimeout(resolve, 200));
                
                await typeText(document.getElementById('signature2'), letterTexts.signature2, 35);
            }, 800);
        }

        // Función para cerrar la carta
        function closeLetter() {
            const modal = document.getElementById('letterModal');
            const letterPaper = document.getElementById('letterPaper');
            const loveMessage = document.getElementById('loveMessage');
            
            // Animación de salida
            letterPaper.classList.add('letter-exit');
            
            setTimeout(() => {
                modal.classList.remove('modal-show');
                setTimeout(() => {
                    modal.style.display = 'none';
                    letterPaper.classList.remove('letter-entrance', 'letter-exit');
                    
                    // Limpiar textos
                    Object.keys(letterTexts).forEach(key => {
                        const element = document.getElementById(key);
                        if (element) element.textContent = '';
                    });
                    
                    // Mostrar mensaje de amor
                    loveMessage.classList.add('show');
                    typeText(document.getElementById('loveText'), loveMessageText, 100);
                    
                    // Ocultar mensaje después de 4 segundos
                    setTimeout(() => {
                        loveMessage.classList.remove('show');
                    }, 4000);
                }, 300);
            }, 500);
        }

        // Mostrar notificación al cargar la página
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('notification').classList.add('show');
                
                // Auto-ocultar notificación después de 5 segundos
                setTimeout(() => {
                    document.getElementById('notification').classList.remove('show');
                }, 5000);
            }, 1000);
        });

        // La notificación ahora solo se cierra, no abre la carta
        document.querySelector('.notification-close').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('notification').classList.remove('show');
        });

        // Solo la carta abre el modal
        document.getElementById('letterContainer').addEventListener('click', function() {
            document.getElementById('notification').classList.remove('show');
            showLetterWithTyping();
        });

        // Cerrar modal
        document.getElementById('closeModal').addEventListener('click', function() {
            closeLetter();
        });

        // Cerrar modal haciendo clic en el overlay
        document.getElementById('modalOverlay').addEventListener('click', function() {
            closeLetter();
        });
    </script>
</body>
</html>
